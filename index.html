<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">

<title>MyCode AI - هوش مصنوعی برنامه نویسی</title>

<style>

:root {
    color-scheme: dark;
    --bg: #0b1020;
    --surface: #121a2b;
    --surface2: #1b2740;
    --border: #2a3955;
    --fg: #eef4ff;
    --sub: #9aabc6;
    --accent: #7759f8;
    --accent2: #9a86ff;
    --ok: #43d3a0;
    --danger: #fb7185;
}

* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
    margin: 0;
}

body {
    font-family: Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
}

button, select, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

/* HEADER */

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 19px;
}

.brand {
    display: flex;
    gap: 12px;
    align-items: center;
}

.brand-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font: 700 18px Consolas, monospace;
    background: linear-gradient(
        135deg,
        #7356f7,
        #3d8cf7
    );
}

.brand h1 {
    font-size: 19px;
    margin: 0 0 4px;
}

.brand small {
    font-size: 11px;
    color: var(--sub);
}

#connectionStatus {
    font-size: 11px;
    color: var(--sub);
    text-align: left;
    max-width: 210px;
    line-height: 1.7;
}

#connectionStatus.ready {
    color: var(--ok);
}

/* MODEL BAR */

.modelbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
    padding: 10px 15px;
    background: #0f1729;
    border-bottom: 1px solid var(--border);
}

select,
.button {
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--fg);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
}

select {
    flex: 1;
    min-width: 180px;
    max-width: 390px;
    outline: none;
}

.button:hover {
    filter: brightness(1.14);
}

.button.primary {
    background: var(--accent);
    border-color: var(--accent);
}

/* PROGRESS */

.progress {
    height: 3px;
    background: #253047;
}

.progress div {
    height: 100%;
    width: 0;
    background: linear-gradient(
        90deg,
        var(--accent),
        #34d399
    );
    transition: width 0.2s;
}

/* WORKSPACE */

.tabs {
    display: none;
}

.workspace {
    display: grid;
    grid-template-columns: 42% 58%;
    flex: 1;
    min-height: 0;
}

.chat,
.codearea {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

.chat {
    border-left: 1px solid var(--border);
}

.pane-title {
    min-height: 52px;
    padding: 11px 15px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid var(--border);
}

.pane-title strong {
    font-size: 13px;
}

/* CHAT */

.messages {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    padding: 18px 15px;
}

.welcome {
    text-align: center;
    max-width: 530px;
    margin: 30px auto;
    padding: 0 8px;
}

.welcome[hidden] {
    display: none;
}

.hero {
    width: 70px;
    height: 70px;
    display: grid;
    place-items: center;
    border-radius: 20px;
    margin: 0 auto 20px;
    background: linear-gradient(
        135deg,
        #7250ff,
        #2788eb
    );
    font: 700 29px Consolas, monospace;
}

.welcome h2 {
    font-size: 22px;
    margin: 0 0 12px;
}

.welcome p {
    font-size: 12px;
    color: var(--sub);
    line-height: 2.1;
}

.suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 23px;
}

.suggestions button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 14px 9px;
    border-radius: 11px;
    font-size: 12px;
}

.suggestions button:hover {
    border-color: var(--accent);
}

/* MESSAGES */

.message {
    margin-bottom: 20px;
    max-width: 100%;
}

.message .who {
    color: var(--accent2);
    font-size: 11px;
    margin-bottom: 7px;
}

.message.user .who {
    color: var(--ok);
}

.bubble {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    unicode-bidi: plaintext;
    line-height: 1.9;
    padding: 13px;
    border-radius: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 12px;
}

.message.user .bubble {
    background: #1d2b50;
}

.message.ai .bubble {
    direction: auto;
}

/* INPUT */

.inputbox {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px;
}

.inputbox textarea {
    resize: vertical;
    width: 100%;
    min-height: 85px;
    max-height: 190px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 11px;
    padding: 12px;
    outline: none;
    line-height: 1.8;
    font-size: 12px;
}

.inputbox textarea:focus {
    border-color: var(--accent);
}

.actionrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 9px;
}

.actionrow #aiStatus {
    color: var(--sub);
    font-size: 11px;
    line-height: 1.8;
}

.send {
    background: var(--accent);
    border: 0;
    border-radius: 9px;
    color: white;
    padding: 12px 17px;
    font-size: 12px;
    flex-shrink: 0;
}

/* CODE EDITOR */

.codearea {
    background: #0a1020;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    padding: 11px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
}

.toolbar .filename {
    font: 12px Consolas, monospace;
    color: var(--sub);
    margin-left: auto;
    direction: ltr;
}

#codeEditor {
    flex: 1;
    min-height: 120px;
    width: 100%;
    resize: none;
    outline: none;
    border: 0;
    background: #0a1020;
    color: #d8e5fc;
    padding: 17px;
    font: 12px/1.8 Consolas, "Courier New", monospace;
    direction: ltr;
    text-align: left;
    tab-size: 4;
}

/* PREVIEW */

.preview-title {
    background: var(--surface);
    border-block: 1px solid var(--border);
    padding: 10px 12px;
    font-size: 12px;
}

.preview {
    width: 100%;
    height: 33%;
    min-height: 115px;
    background: white;
    border: 0;
}

/* MOBILE */

@media(max-width:800px) {

    header {
        padding: 10px 12px;
    }

    .brand-icon {
        width: 38px;
        height: 38px;
    }

    .brand h1 {
        font-size: 16px;
    }

    .brand small {
        font-size: 10px;
    }

    #connectionStatus {
        font-size: 10px;
        max-width: 140px;
    }

    .workspace {
        display: flex;
        flex-direction: column;
    }

    .tabs {
        display: flex;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
    }

    .tabs button {
        background: transparent;
        border: 0;
        flex: 1;
        color: var(--sub);
        padding: 13px;
    }

    .tabs button.active {
        color: white;
        border-bottom: 2px solid var(--accent);
    }

    .chat,
    .codearea {
        flex: 1;
    }

    .codearea {
        display: none;
    }

    .workspace.show-code .chat {
        display: none;
    }

    .workspace.show-code .codearea {
        display: flex;
    }

    .messages {
        padding: 12px;
    }

    .welcome {
        margin: 20px auto;
    }

    .suggestions {
        gap: 8px;
    }

    .preview {
        height: 32%;
    }

}

</style>

</head>

<body>

<div class="app">

<header>

    <div class="brand">

        <div class="brand-icon">
            &lt;/&gt;
        </div>

        <div>
            <h1>MyCode AI</h1>
            <small>
                هوش مصنوعی شخصی برنامه‌نویسی
            </small>
        </div>

    </div>

    <span id="connectionStatus">
        مدل بارگذاری نشده
    </span>

</header>


<!-- MODEL SELECTION -->

<div class="modelbar">

    <select id="modelSelect">

        <option value="coder">
            Qwen2.5 Coder 0.5B - مخصوص کدنویسی
        </option>

        <option value="light">
            SmolLM2 135M - مدل سبک گوشی
        </option>

    </select>

    <button
        id="loadBtn"
        class="button primary"
    >
        فعال‌سازی هوش مصنوعی
    </button>

</div>


<div class="progress">
    <div id="progressFill"></div>
</div>


<!-- MOBILE TABS -->

<div class="tabs">

    <button id="chatTab" class="active">
        گفتگو
    </button>

    <button id="codeTab">
        ویرایشگر کد
    </button>

</div>


<!-- MAIN WORKSPACE -->

<main class="workspace" id="workspace">


<!-- CHAT PANEL -->

<section class="chat">

    <div class="pane-title">

        <strong>
            گفتگو با MyCode AI
        </strong>

        <button id="clearBtn" class="button">
            گفتگوی جدید
        </button>

    </div>


    <div id="messages" class="messages">

        <div id="welcome" class="welcome">

            <div class="hero">
                &lt;/&gt;
            </div>

            <h2>
                چه برنامه‌ای بسازیم؟
            </h2>

            <p>
                هوش مصنوعی شخصی مخصوص برنامه‌نویسی
                <br>
                بدون نیاز به API و WebGPU
                <br>
                با پردازنده گوشی کار می‌کند.
            </p>


            <div class="suggestions">

                <button
                    data-suggest="یک بازی مار کامل با HTML و CSS و JavaScript بساز"
                >
                    ساخت بازی مار
                </button>

                <button
                    data-suggest="یک ماشین حساب زیبا با HTML و CSS و JavaScript بساز"
                >
                    ساخت ماشین حساب
                </button>

                <button
                    data-suggest="یک سایت فروشگاهی واکنش گرا با HTML بساز"
                >
                    ساخت فروشگاه
                </button>

                <button
                    data-suggest="یک برنامه ماشین حساب با Python بنویس"
                >
                    برنامه Python
                </button>

            </div>

        </div>

    </div>


    <!-- MESSAGE INPUT -->

    <div class="inputbox">

        <textarea
            id="prompt"
            placeholder="مثلاً: یک بازی دوز با HTML بساز که بتوانم با کامپیوتر بازی کنم..."
        ></textarea>

        <div class="actionrow">

            <span id="aiStatus">
                ابتدا مدل را فعال کن.
            </span>

            <button class="send" id="sendBtn">
                ارسال ↑
            </button>

        </div>

    </div>

</section>


<!-- CODE PANEL -->

<section class="codearea">

    <div class="toolbar">

        <span class="filename" id="codeTitle">
            index.html
        </span>

        <button id="copyBtn" class="button">
            کپی
        </button>

        <button id="downloadBtn" class="button">
            دانلود
        </button>

        <button id="runBtn" class="button primary">
            اجرای HTML
        </button>

    </div>


    <textarea
        spellcheck="false"
        id="codeEditor"
        placeholder="// کدهای تولیدشده اینجا نمایش داده می‌شوند..."
    ></textarea>


    <div class="preview-title">
        پیش‌نمایش HTML
    </div>

    <iframe
        class="preview"
        id="preview"
        title="پیش‌نمایش HTML"
        sandbox="allow-scripts"
        referrerpolicy="no-referrer"
    ></iframe>

</section>

</main>

</div>


<!-- ======================================
     AI ENGINE - CPU VERSION
====================================== -->

<script type="module">

/* ======================================
   HTML ELEMENTS
====================================== */

const $ = id => document.getElementById(id);

const els = {

    messages: $("messages"),

    prompt: $("prompt"),

    editor: $("codeEditor"),

    send: $("sendBtn"),

    load: $("loadBtn"),

    model: $("modelSelect"),

    status: $("aiStatus"),

    connection: $("connectionStatus"),

    progress: $("progressFill"),

    preview: $("preview"),

    title: $("codeTitle")

};


/* ======================================
   LOCAL AI MODELS
====================================== */

const MODEL_CODER =
    "onnx-community/Qwen2.5-Coder-0.5B-Instruct";

const MODEL_LIGHT =
    "onnx-community/SmolLM2-135M-Instruct-ONNX";


/* ======================================
   AI VARIABLES
====================================== */

let generator = null;

let transformers = null;

let currentModel = null;

let busy = false;

let loading = false;

let history = [];

let language = "html";


/* ======================================
   PERSONAL AI INSTRUCTIONS
====================================== */

const systemPrompt = `

You are MyCode AI.

You are a personal artificial intelligence
specialized in software engineering.

Your primary job is writing computer code.

You understand:

HTML
CSS
JavaScript
Python
C++
PHP
SQL

Rules:

1. Write actual working code.

2. Do not provide pseudocode when
the user requests a working program.

3. When HTML is requested,
generate a complete HTML file.

4. Include CSS and JavaScript
inside the HTML file when needed.

5. Always place source code inside
markdown code fences.

6. Use correct language identifiers.

7. When the user asks for modifications,
provide the complete updated code.

8. Help the user identify errors.

9. Respond in Persian when the user
speaks Persian.

10. Do not falsely claim that code
has been tested.

11. Keep explanations concise.

12. You are MyCode AI,
a personal coding assistant.

`;


/* ======================================
   STATUS MANAGEMENT
====================================== */

function setStatus(text) {

    els.status.textContent = text;

}


function scrollDown() {

    els.messages.scrollTop =
        els.messages.scrollHeight;

}


/* ======================================
   ADD CHAT MESSAGE
====================================== */

function message(role, text) {

    const row = document.createElement("div");

    row.className = "message " + role;


    const who = document.createElement("div");

    who.className = "who";

    who.textContent =
        role === "user"
        ? "شما"
        : "MyCode AI";


    const body = document.createElement("div");

    body.className = "bubble";

    body.textContent = text;


    row.append(who, body);

    els.messages.append(row);

    scrollDown();

    return body;

}


/* ======================================
   SAVE MEMORY
====================================== */

function save() {

    try {

        localStorage.setItem(

            "mycode_v1_history",

            JSON.stringify(history.slice(-12))

        );


        localStorage.setItem(

            "mycode_v1_editor",

            els.editor.value.slice(0, 250000)

        );


        localStorage.setItem(

            "mycode_v1_lang",

            language

        );

    }

    catch (error) {

        console.warn("Storage:", error);

    }

}


/* ======================================
   RESTORE MEMORY
====================================== */

function restore() {

    try {

        const saved = JSON.parse(

            localStorage.getItem(
                "mycode_v1_history"
            ) || "[]"

        );


        if (Array.isArray(saved)) {

            history = saved.filter(item =>

                item &&

                ["user", "assistant"].includes(item.role) &&

                typeof item.content === "string"

            ).slice(-12);


            if (history.length) {

                $("welcome").hidden = true;


                history.forEach(item => {

                    message(

                        item.role === "user"
                            ? "user"
                            : "ai",

                        item.content

                    );

                });

            }

        }


        els.editor.value =
            localStorage.getItem(
                "mycode_v1_editor"
            ) || "";


        language =
            localStorage.getItem(
                "mycode_v1_lang"
            ) || "html";


        updateFileName();

    }

    catch (error) {

        console.warn("Restore:", error);

    }

}


/* ======================================
   CODE FILE NAME
====================================== */

function updateFileName() {

    const extensions = {

        html: "html",

        htm: "html",

        js: "js",

        javascript: "js",

        py: "py",

        python: "py",

        css: "css",

        cpp: "cpp",

        "c++": "cpp",

        php: "php",

        json: "json",

        sql: "sql"

    };


    const extension =
        extensions[language] || "txt";


    els.title.textContent =
        "mycode-project." + extension;

}


/* ======================================
   EXTRACT GENERATED CODE
====================================== */

function extractCode(text) {

    const blocks = [

        ...text.matchAll(
            /```([^\r\n`]*)\r?\n([\s\S]*?)```/g
        )

    ];


    if (blocks.length) {

        const selected =

            blocks.find(block =>

                /^html\s*$/i.test(block[1])

            ) || blocks[0];


        language = (

            selected[1]
                .trim()
                .split(/\s+/)[0] || "txt"

        ).toLowerCase();


        els.editor.value =
            selected[2].trim();


        updateFileName();

        save();

        return true;

    }


    const isHTML =
        /^\s*<(?:!doctype\s+html|html)[\s>]/i.test(text);


    if (isHTML) {

        language = "html";

        els.editor.value = text.trim();

        updateFileName();

        save();

        return true;

    }


    return false;

}


/* ======================================
   LOAD AI MODEL USING CPU
====================================== */

async function loadModel() {

    if (busy || loading) {
        return;
    }


    if (!window.isSecureContext) {

        setStatus(
            "صفحه باید با HTTPS اجرا شود."
        );

        return;

    }


    loading = true;

    els.load.disabled = true;

    els.send.disabled = true;

    els.model.disabled = true;


    els.connection.classList.remove("ready");

    els.connection.textContent =
        "در حال آماده‌سازی مدل CPU...";


    setStatus(
        "در حال آماده‌سازی موتور هوش مصنوعی..."
    );


    els.progress.style.width = "0%";


    try {

        /* IMPORT TRANSFORMERS.JS */

        if (!transformers) {

            transformers = await import(

                "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1"

            );

        }


        /* CONFIGURE CPU */

        transformers.env.allowLocalModels = false;


        transformers.env.backends.onnx.wasm.numThreads = 1;


        /* SELECT MODEL */

        const selected =

            els.model.value === "coder"

            ? MODEL_CODER

            : MODEL_LIGHT;


        generator = null;

        currentModel = null;


        setStatus(
            "در حال دانلود مدل هوش مصنوعی..."
        );


        /* CREATE AI PIPELINE */

        generator = await transformers.pipeline(

            "text-generation",

            selected,

            {

                dtype: "q4",

                device: "wasm",

                progress_callback: progress => {

                    if (

                        progress.status === "progress" &&

                        Number.isFinite(progress.progress)

                    ) {

                        const percent = Math.max(

                            0,

                            Math.min(

                                100,

                                Math.round(progress.progress)

                            )

                        );


                        els.progress.style.width =
                            percent + "%";


                        setStatus(

                            "در حال دریافت مدل: " +

                            percent +

                            "٪ — " +

                            (progress.file || "")

                        );

                    }

                    else if (progress.status === "done") {

                        setStatus(

                            "فایل دریافت شد؛ " +

                            "در حال آماده‌سازی هوش مصنوعی..."

                        );

                    }

                }

            }

        );


        /* MODEL READY */

        currentModel = selected;


        els.progress.style.width = "100%";


        els.connection.textContent =
            "● هوش مصنوعی فعال است";


        els.connection.classList.add("ready");


        els.load.textContent =
            "مدل فعال شد";


        setStatus(

            "هوش مصنوعی آماده کدنویسی است."

        );

    }

    catch (error) {

        console.error(error);


        generator = null;

        currentModel = null;


        els.connection.textContent =
            "خطا در فعال‌سازی";


        els.connection.classList.remove("ready");


        setStatus(

            "خطا در بارگذاری مدل: " +

            (error.message || String(error)) +

            " — اینترنت و حافظه گوشی را بررسی کن."

        );


        els.load.textContent =
            "تلاش مجدد";

    }

    finally {

        loading = false;

        els.load.disabled = false;

        els.send.disabled = false;

        els.model.disabled = false;

    }

}


/* ======================================
   GENERATE AI RESPONSE
====================================== */

async function sendMessage() {

    if (busy || loading) {
        return;
    }


    const selected =

        els.model.value === "coder"

        ? MODEL_CODER

        : MODEL_LIGHT;


    if (

        !generator ||

        currentModel !== selected

    ) {

        setStatus(

            "ابتدا مدل انتخاب‌شده را فعال کن."

        );

        return;

    }


    const text =
        els.prompt.value.trim();


    if (!text) {
        return;
    }


    busy = true;

    els.send.disabled = true;

    els.load.disabled = true;

    els.model.disabled = true;


    $("welcome").hidden = true;


    message("user", text);


    els.prompt.value = "";


    const previous = [...history];


    history.push({

        role: "user",

        content: text

    });


    const outputBubble = message(

        "ai",

        "در حال تولید پاسخ..."

    );


    setStatus(

        "هوش مصنوعی با CPU گوشی " +

        "در حال تولید کد است..."

    );


    try {

        /* PREPARE CHAT MEMORY */

        const conversation = history

            .slice(-4)

            .map(item => ({

                role: item.role,

                content: item.content.slice(0, 1800)

            }));


        /* INCLUDE EXISTING CODE
           WHEN USER REQUESTS EDITS */

        const editRequested =

            /(اصلاح|تغییر|بروزرسان|باگ|خطا|fix|edit|modify)/i

            .test(text);


        if (

            els.editor.value.trim() &&

            editRequested

        ) {

            conversation[
                conversation.length - 1
            ] = {

                role: "user",

                content:

                    "Current code:\n```" +

                    language +

                    "\n" +

                    els.editor.value.slice(0, 2500) +

                    "\n```\nRequest: " +

                    text

            };

        }


        /* ASK LOCAL AI */

        const result = await generator(

            [

                {

                    role: "system",

                    content: systemPrompt

                },

                ...conversation

            ],

            {

                max_new_tokens:

                    els.model.value === "coder"

                    ? 420

                    : 280,

                do_sample: false,

                return_full_text: true

            }

        );


        /* EXTRACT AI RESPONSE */

        const generated =
            result?.[0]?.generated_text;


        const output =

            Array.isArray(generated)

            ? String(

                generated[
                    generated.length - 1
                ]?.content || ""

            )

            : typeof generated === "string"

                ? generated

                : "";


        if (!output.trim()) {

            throw new Error(

                "مدل پاسخی تولید نکرد."

            );

        }


        outputBubble.textContent = output;


        scrollDown();


        /* SAVE CHAT HISTORY */

        history.push({

            role: "assistant",

            content: output

        });


        /* UPDATE CODE EDITOR */

        const hasCode =
            extractCode(output);


        if (hasCode) {

            setStatus(

                "کد تولید شد. " +

                "تب ویرایشگر کد را باز کن."

            );

        }

        else {

            setStatus(

                "پاسخ هوش مصنوعی دریافت شد."

            );

        }


        save();

    }

    catch (error) {

        console.error(error);


        outputBubble.textContent =

            "خطا در تولید پاسخ:\n" +

            (error.message || String(error));


        history = previous;


        setStatus(

            "تولید پاسخ ناموفق بود."

        );


        save();

    }

    finally {

        busy = false;

        els.send.disabled = false;

        els.load.disabled = false;

        els.model.disabled = false;

    }

}


/* ======================================
   RUN HTML CODE
====================================== */

function runCode() {

    const code =
        els.editor.value.trim();


    if (!code) {

        setStatus(

            "کدی برای اجرا وجود ندارد."

        );

        return;

    }


    if (

        language !== "html" &&

        language !== "htm"

    ) {

        setStatus(

            "در این نسخه فقط HTML اجرا می‌شود."

        );

        return;

    }


    els.preview.srcdoc = code;


    setStatus(

        "پیش‌نمایش HTML اجرا شد."

    );

}


/* ======================================
   DOWNLOAD GENERATED CODE
====================================== */

function downloadCode() {

    const text =
        els.editor.value;


    if (!text.trim()) {

        setStatus(

            "ابتدا یک کد تولید کن."

        );

        return;

    }


    updateFileName();


    const blob = new Blob(

        [text],

        {

            type: "text/plain;charset=utf-8"

        }

    );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    link.download =
        els.title.textContent;


    document.body.append(link);


    link.click();


    link.remove();


    setTimeout(() => {

        URL.revokeObjectURL(url);

    }, 1000);


    setStatus(

        "فایل کد ذخیره شد."

    );

}


/* ======================================
   COPY CODE
====================================== */

async function copyCode() {

    const code =
        els.editor.value;


    if (!code.trim()) {

        setStatus(
            "کدی برای کپی وجود ندارد."
        );

        return;

    }


    try {

        await navigator.clipboard.writeText(code);


        setStatus(
            "کد کپی شد."
        );

    }

    catch (error) {

        setStatus(
            "کپی ناموفق بود."
        );

    }

}


/* ======================================
   NEW CHAT
====================================== */

function clearChat() {

    if (busy || loading) {
        return;
    }


    history = [];


    els.messages.replaceChildren();


    const welcome =
        document.createElement("div");


    welcome.className = "welcome";


    welcome.textContent =

        "گفتگوی جدید آماده است. " +

        "درخواست برنامه‌نویسی خودت را بنویس.";


    els.messages.append(welcome);


    els.editor.value = "";


    language = "html";


    updateFileName();


    els.preview.srcdoc = "";


    save();


    setStatus(

        generator

        ? "گفتگوی جدید آماده است."

        : "ابتدا مدل را فعال کن."

    );

}


/* ======================================
   MOBILE TABS
====================================== */

function tab(name) {

    $("workspace").classList.toggle(

        "show-code",

        name === "code"

    );


    $("chatTab").classList.toggle(

        "active",

        name === "chat"

    );


    $("codeTab").classList.toggle(

        "active",

        name === "code"

    );

}


/* ======================================
   BUTTON EVENTS
====================================== */

els.load.addEventListener(

    "click",

    loadModel

);


els.send.addEventListener(

    "click",

    sendMessage

);


$("runBtn").addEventListener(

    "click",

    runCode

);


$("downloadBtn").addEventListener(

    "click",

    downloadCode

);


$("copyBtn").addEventListener(

    "click",

    copyCode

);


$("clearBtn").addEventListener(

    "click",

    clearChat

);


/* ======================================
   MOBILE NAVIGATION
====================================== */

$("chatTab").addEventListener(

    "click",

    () => tab("chat")

);


$("codeTab").addEventListener(

    "click",

    () => tab("code")

);


/* ======================================
   SUGGESTIONS
====================================== */

document.querySelectorAll(

    "[data-suggest]"

).forEach(button => {

    button.addEventListener(

        "click",

        () => {

            els.prompt.value =
                button.dataset.suggest;


            els.prompt.focus();

        }

    );

});


/* ======================================
   KEYBOARD SHORTCUT
====================================== */

els.prompt.addEventListener(

    "keydown",

    event => {

        if (

            event.key === "Enter" &&

            event.ctrlKey

        ) {

            event.preventDefault();

            sendMessage();

        }

    }

);


/* ======================================
   AUTO SAVE CODE
====================================== */

els.editor.addEventListener(

    "input",

    save

);


/* ======================================
   MODEL SELECTION
====================================== */

els.model.addEventListener(

    "change",

    () => {

        if (currentModel) {

            els.connection.textContent =

                "مدل جدید را فعال کن";


            els.connection.classList.remove(

                "ready"

            );


            setStatus(

                "برای تغییر مدل، " +

                "روی فعال‌سازی بزن."

            );

        }

    }

);


/* ======================================
   INITIALIZE APPLICATION
====================================== */

restore();


setStatus(

    "مدل را انتخاب کن و " +

    "روی فعال‌سازی هوش مصنوعی بزن."

);

</script>
