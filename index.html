<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>

<title>XO Smart AI</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

/* =========================================
   RESET
========================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;

  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

:root{

  --app-height:100dvh;

  --bg:#050817;

  --panel:rgba(20,28,62,.70);
  --panel2:rgba(255,255,255,.055);

  --border:rgba(255,255,255,.10);

  --text:#ffffff;
  --muted:#929ab9;

  --x:#7484ff;
  --o:#ff528f;

  --purple:#7167ff;
}

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;
}

body{

  font-family:
    Tahoma,
    Arial,
    sans-serif;

  color:var(--text);

  background:

    radial-gradient(
      circle at 15% 5%,
      rgba(90,73,255,.22),
      transparent 32%
    ),

    radial-gradient(
      circle at 85% 90%,
      rgba(255,62,142,.13),
      transparent 35%
    ),

    linear-gradient(
      180deg,
      #030616,
      #07112c
    );
}


/* =========================================
   GALAXY
========================================= */

.stars{

  position:fixed;

  inset:0;

  pointer-events:none;

  overflow:hidden;
}

.star{

  position:absolute;

  width:2px;
  height:2px;

  border-radius:50%;

  background:white;

  animation:
    twinkle
    2.2s
    infinite
    alternate;
}

@keyframes twinkle{

  from{

    opacity:.15;

    transform:
      scale(.7);
  }

  to{

    opacity:.9;

    transform:
      scale(1.35);
  }
}


/* =========================================
   APP
========================================= */

.app{

  position:relative;

  z-index:2;

  width:100%;

  max-width:460px;

  height:var(--app-height);

  margin:auto;

  padding:

    max(
      8px,
      env(safe-area-inset-top)
    )

    11px

    max(
      9px,
      env(safe-area-inset-bottom)
    );

  display:grid;

  grid-template-rows:
    auto
    auto
    auto
    minmax(0,1fr)
    auto;

  gap:7px;
}


/* =========================================
   HEADER
========================================= */

.header{

  min-height:49px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:8px;

  padding:
    6px
    10px;

  border-radius:16px;

  border:
    1px solid
    var(--border);

  background:
    var(--panel);

  backdrop-filter:
    blur(17px);
}

.header-left{

  display:flex;

  align-items:center;

  gap:9px;
}

.logo{

  width:36px;
  height:36px;

  border-radius:12px;

  display:grid;

  place-items:center;

  font-weight:900;

  font-size:15px;

  background:

    linear-gradient(
      135deg,
      #776bff,
      #5145da
    );

  box-shadow:
    0 7px 18px
    rgba(92,76,255,.25);
}

.title b{

  display:block;

  font-size:14px;
}

.title span{

  display:block;

  margin-top:2px;

  font-size:8px;

  color:var(--muted);
}

.header-actions{

  display:flex;

  gap:5px;
}

.icon-btn{

  width:34px;
  height:34px;

  border:none;

  border-radius:11px;

  color:white;

  font-size:15px;

  cursor:pointer;

  border:
    1px solid
    rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.065);
}

.icon-btn:active{

  transform:
    scale(.93);
}


/* =========================================
   SCORE
========================================= */

.scoreboard{

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:5px;
}

.score{

  min-width:0;

  padding:
    6px
    3px;

  border-radius:13px;

  text-align:center;

  border:
    1px solid
    var(--border);

  background:
    var(--panel);
}

.score span{

  display:block;

  color:var(--muted);

  font-size:8px;
}

.score strong{

  display:block;

  margin-top:2px;

  font-size:18px;
}

.human-score{

  color:var(--x);
}

.ai-score{

  color:var(--o);
}


/* =========================================
   STATUS
========================================= */

.status{

  min-height:38px;

  padding:
    5px
    8px;

  border-radius:13px;

  border:
    1px solid
    var(--border);

  background:
    var(--panel);

  display:flex;

  justify-content:center;

  align-items:center;

  text-align:center;

  font-size:10px;

  font-weight:bold;

  overflow:hidden;
}


/* =========================================
   THINKING
========================================= */

.thinking-dots{

  display:inline-flex;

  gap:3px;

  margin-right:6px;
}

.thinking-dots i{

  width:4px;
  height:4px;

  border-radius:50%;

  background:
    var(--o);

  animation:
    thinking
    .7s
    infinite;
}

.thinking-dots i:nth-child(2){

  animation-delay:.12s;
}

.thinking-dots i:nth-child(3){

  animation-delay:.24s;
}

@keyframes thinking{

  0%,
  100%{

    opacity:.25;

    transform:
      translateY(0);
  }

  50%{

    opacity:1;

    transform:
      translateY(-4px);
  }
}


/* =========================================
   BOARD AREA
========================================= */

.board-area{

  min-height:0;

  width:100%;

  display:flex;

  align-items:center;

  justify-content:center;
}


/*
   این قسمت باعث می‌شود
   مربع‌ها هیچ‌وقت به هم نریزند.
*/

.board{

  width:

    min(
      calc(100vw - 22px),
      calc(var(--app-height) - 205px),
      410px
    );

  aspect-ratio:
    1 / 1;

  display:grid;

  grid-template-columns:
    repeat(
      3,
      minmax(0,1fr)
    );

  grid-template-rows:
    repeat(
      3,
      minmax(0,1fr)
    );

  gap:8px;

  flex:none;
}


/* =========================================
   CELL
========================================= */

.cell{

  width:100%;
  height:100%;

  min-width:0;
  min-height:0;

  overflow:hidden;

  display:flex;

  justify-content:center;

  align-items:center;

  border:none;

  border-radius:
    clamp(
      14px,
      4vw,
      22px
    );

  border:
    1px solid
    var(--border);

  background:

    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.025)
    );

  backdrop-filter:
    blur(12px);

  cursor:pointer;

  transition:

    transform .13s,
    border-color .2s,
    background .2s,
    box-shadow .2s;
}

.cell:active{

  transform:
    scale(.93);
}


/* =========================================
   X / O
========================================= */

.mark{

  font-family:
    Arial,
    sans-serif;

  line-height:1;

  font-size:

    clamp(
      46px,
      17vw,
      78px
    );

  animation:

    markAppear
    .27s
    cubic-bezier(
      .18,
      1.5,
      .4,
      1
    );
}

.mark.x{

  color:var(--x);

  text-shadow:

    0 0 22px
    rgba(116,132,255,.42);
}

.mark.o{

  color:var(--o);

  text-shadow:

    0 0 22px
    rgba(255,82,143,.42);
}

@keyframes markAppear{

  from{

    opacity:0;

    transform:

      scale(.15)
      rotate(-22deg);
  }

  75%{

    transform:
      scale(1.10);
  }

  to{

    opacity:1;

    transform:
      scale(1);
  }
}


/* =========================================
   WIN EFFECT
========================================= */

.cell.win-x{

  border-color:
    rgba(116,132,255,.75);

  background:
    rgba(116,132,255,.13);

  animation:
    glowX
    .6s
    infinite
    alternate;
}

.cell.win-o{

  border-color:
    rgba(255,82,143,.75);

  background:
    rgba(255,82,143,.13);

  animation:
    glowO
    .6s
    infinite
    alternate;
}

@keyframes glowX{

  to{

    transform:
      scale(.96);

    box-shadow:

      0 0 25px
      rgba(116,132,255,.55);
  }
}

@keyframes glowO{

  to{

    transform:
      scale(.96);

    box-shadow:

      0 0 25px
      rgba(255,82,143,.55);
  }
}


/* =========================================
   FOOTER
========================================= */

.footer{

  display:grid;

  grid-template-columns:
    1fr
    auto;

  gap:6px;
}

.new-game{

  height:45px;

  border:none;

  border-radius:14px;

  color:white;

  font-size:12px;

  font-weight:900;

  cursor:pointer;

  background:

    linear-gradient(
      135deg,
      #6c70ff,
      #7d58ef
    );

  box-shadow:

    0 9px 23px
    rgba(89,72,230,.22);
}

.ai-info{

  min-width:80px;

  padding:
    5px
    8px;

  border-radius:14px;

  border:
    1px solid
    var(--border);

  background:
    var(--panel);

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;
}

.ai-info span{

  font-size:7px;

  color:var(--muted);
}

.ai-info strong{

  margin-top:1px;

  font-size:9px;
}


/* =========================================
   RPS MODAL
========================================= */

.overlay{

  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;

  justify-content:center;

  padding:17px;

  background:
    rgba(2,5,16,.88);

  backdrop-filter:
    blur(15px);
}

.overlay.show{

  display:flex;
}

.rps-card{

  width:100%;

  max-width:365px;

  padding:
    22px
    16px;

  border-radius:25px;

  text-align:center;

  border:
    1px solid
    var(--border);

  background:

    linear-gradient(
      180deg,
      #151e42,
      #0f1734
    );

  box-shadow:

    0 20px 55px
    rgba(0,0,0,.35);

  animation:
    modalIn
    .27s
    ease;
}

@keyframes modalIn{

  from{

    opacity:0;

    transform:
      scale(.87);
  }
}

.rps-card h2{

  font-size:19px;
}

.rps-card p{

  margin-top:5px;

  color:var(--muted);

  font-size:9px;
}

.rps-buttons{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:7px;

  margin-top:17px;
}

.rps-btn{

  height:88px;

  border-radius:17px;

  border:
    1px solid
    var(--border);

  background:
    rgba(255,255,255,.06);

  color:white;

  font-size:31px;

  cursor:pointer;
}

.rps-btn:active{

  transform:
    scale(.91);
}

.rps-btn span{

  display:block;

  margin-top:5px;

  font-size:9px;

  color:#b9c0dc;
}

.rps-result{

  min-height:63px;

  margin-top:15px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:7px;

  font-size:11px;

  line-height:1.6;
}


/* =========================================
   VERY SMALL SCREEN
========================================= */

@media(max-height:650px){

  .app{

    gap:5px;

    padding-top:5px;

    padding-bottom:5px;
  }

  .header{

    min-height:40px;
  }

  .logo{

    width:30px;
    height:30px;
  }

  .title span{

    display:none;
  }

  .status{

    min-height:30px;

    font-size:9px;
  }

  .board{

    width:

      min(
        calc(100vw - 26px),
        calc(var(--app-height) - 165px),
        330px
      );
  }

  .new-game{

    height:39px;
  }

}


/* =========================================
   EXTREMELY SHORT SCREEN
========================================= */

@media(max-height:540px){

  .status{

    display:none;
  }

  .board{

    width:

      min(
        calc(100vw - 28px),
        calc(var(--app-height) - 115px),
        300px
      );
  }

}

</style>
</head>

<body>


<!-- =====================================
     GALAXY
===================================== -->

<div
  class="stars"
  id="stars"
></div>



<!-- =====================================
     APP
===================================== -->

<div class="app">


  <!-- HEADER -->

  <header class="header">

    <div class="header-left">

      <div class="logo">
        XO
      </div>

      <div class="title">

        <b>
          XO Smart AI
        </b>

        <span>
          هوش مصنوعی شکست‌ناپذیر و یادگیرنده
        </span>

      </div>

    </div>


    <div class="header-actions">

      <button
        class="icon-btn"
        onclick="resetAIMemory()"
        title="پاک کردن حافظه AI"
      >
        🧠
      </button>


      <button
        class="icon-btn"
        onclick="newRound()"
      >
        ↻
      </button>

    </div>

  </header>



  <!-- SCORE -->

  <section class="scoreboard">

    <div class="score">

      <span>
        شما ❌
      </span>

      <strong
        class="human-score"
        id="humanScore"
      >
        0
      </strong>

    </div>


    <div class="score">

      <span>
        مساوی
      </span>

      <strong
        id="drawScore"
      >
        0
      </strong>

    </div>


    <div class="score">

      <span>
        AI ⭕
      </span>

      <strong
        class="ai-score"
        id="aiScore"
      >
        0
      </strong>

    </div>

  </section>



  <!-- STATUS -->

  <div
    class="status"
    id="status"
  >
    تعیین شروع‌کننده...
  </div>



  <!-- BOARD -->

  <main class="board-area">

    <div
      class="board"
      id="board"
    ></div>

  </main>



  <!-- FOOTER -->

  <footer class="footer">

    <button
      class="new-game"
      onclick="newRound()"
    >
      بازی جدید
    </button>


    <div class="ai-info">

      <span>
        بازی‌های یادگرفته‌شده
      </span>

      <strong
        id="learnedGames"
      >
        0
      </strong>

    </div>

  </footer>


</div>



<!-- =====================================
     ROCK PAPER SCISSORS
===================================== -->

<div
  class="overlay"
  id="rpsOverlay"
>

  <div class="rps-card">

    <h2>
      ✊ سنگ، کاغذ، قیچی
    </h2>

    <p>
      برنده مشخص می‌کند چه کسی دوز را شروع کند
    </p>


    <div class="rps-buttons">


      <button
        class="rps-btn"
        onclick="playRPS('rock')"
      >
        ✊
        <span>
          سنگ
        </span>
      </button>


      <button
        class="rps-btn"
        onclick="playRPS('paper')"
      >
        ✋
        <span>
          کاغذ
        </span>
      </button>


      <button
        class="rps-btn"
        onclick="playRPS('scissors')"
      >
        ✌️
        <span>
          قیچی
        </span>
      </button>


    </div>


    <div
      class="rps-result"
      id="rpsResult"
    >
      یکی رو انتخاب کن 👆
    </div>

  </div>

</div>



<script>

/* =========================================
   TELEGRAM VIEWPORT
========================================= */

function updateViewportHeight(){

  let height =
    window.innerHeight;


  try{

    if(
      window.Telegram
      ?.WebApp
      ?.viewportStableHeight
    ){

      height =
        Telegram
        .WebApp
        .viewportStableHeight;

    }

  }
  catch(e){}


  document
    .documentElement
    .style
    .setProperty(
      "--app-height",
      height+"px"
    );

}


updateViewportHeight();


window.addEventListener(
  "resize",
  updateViewportHeight
);


try{

  Telegram.WebApp.ready();

  Telegram.WebApp.expand();

}
catch(e){}



/* =========================================
   GALAXY
========================================= */

const stars =
  document.getElementById(
    "stars"
  );


for(
  let i=0;
  i<65;
  i++
){

  const star =
    document.createElement(
      "i"
    );


  star.className =
    "star";


  star.style.left =
    Math.random()*100
    +"%";


  star.style.top =
    Math.random()*100
    +"%";


  star.style.animationDelay =
    Math.random()*3
    +"s";


  const size =
    1+Math.random()*1.5;


  star.style.width =
    size+"px";


  star.style.height =
    size+"px";


  stars.appendChild(
    star
  );

}



/* =========================================
   CONSTANTS
========================================= */

const HUMAN =
  "X";


const AI =
  "O";


const WIN_LINES = [

  [0,1,2],
  [3,4,5],
  [6,7,8],

  [0,3,6],
  [1,4,7],
  [2,5,8],

  [0,4,8],
  [2,4,6]

];



/* =========================================
   GAME VARIABLES
========================================= */

let board =
  Array(9).fill("");


let gameActive =
  false;


let aiThinking =
  false;


let rpsLocked =
  false;


let gameRecorded =
  false;


let scores = {

  human:0,
  ai:0,
  draw:0

};



/* =========================================
   AI MEMORY
========================================= */

/*

ساختار حافظه:

{
  games: 20,

  states: {

    "X...O....": {
      "1": 4,
      "5": 7,
      "8": 2
    }

  }
}

یعنی:

وقتی صفحه در یک وضعیت خاص بوده،
کاربر بیشتر کدام خانه را انتخاب کرده؟
*/


const MEMORY_KEY =
  "xo_smart_ai_memory_v1";


let aiMemory =
  loadMemory();



function loadMemory(){

  try{

    const saved =
      localStorage.getItem(
        MEMORY_KEY
      );


    if(saved){

      const parsed =
        JSON.parse(
          saved
        );


      return{

        games:
          parsed.games
          ||
          0,

        states:
          parsed.states
          ||
          {}

      };

    }

  }
  catch(e){}


  return{

    games:0,

    states:{}

  };

}



function saveMemory(){

  try{

    localStorage.setItem(

      MEMORY_KEY,

      JSON.stringify(
        aiMemory
      )

    );

  }
  catch(e){}


  updateAIInfo();

}



function resetAIMemory(){

  const sure =
    confirm(
      "حافظه هوش مصنوعی پاک شود؟"
    );


  if(!sure)
    return;


  aiMemory = {

    games:0,

    states:{}

  };


  saveMemory();


  setStatus(
    "🧠 حافظه AI پاک شد"
  );

}



/* =========================================
   BOARD KEY
========================================= */

function boardKey(
  state
){

  return state
    .map(
      cell =>
        cell===""
        ? "."
        : cell
    )
    .join("");

}



/* =========================================
   RECORD HUMAN MOVE
========================================= */

function rememberHumanMove(
  stateBeforeMove,
  move
){

  const key =
    boardKey(
      stateBeforeMove
    );


  if(
    !aiMemory.states[key]
  ){

    aiMemory.states[key] =
      {};

  }


  if(
    !aiMemory.states[key][move]
  ){

    aiMemory.states[key][move] =
      0;

  }


  aiMemory.states[key][move]++;


  saveMemory();

}



/* =========================================
   BUILD BOARD
========================================= */

function createBoard(){

  const boardElement =
    document.getElementById(
      "board"
    );


  boardElement.innerHTML =
    "";


  for(
    let i=0;
    i<9;
    i++
  ){

    const cell =
      document.createElement(
        "button"
      );


    cell.className =
      "cell";


    cell.dataset.index =
      i;


    cell.onclick =
      ()=>humanMove(
        i
      );


    boardElement.appendChild(
      cell
    );

  }

}



/* =========================================
   NEW ROUND
========================================= */

function newRound(){

  board =
    Array(9).fill("");


  gameActive =
    false;


  aiThinking =
    false;


  rpsLocked =
    false;


  gameRecorded =
    false;


  createBoard();


  setStatus(
    "سنگ، کاغذ، قیچی برای تعیین شروع‌کننده"
  );


  document.getElementById(
    "rpsResult"
  ).innerHTML =
    "یکی رو انتخاب کن 👆";


  document
    .getElementById(
      "rpsOverlay"
    )
    .classList.add(
      "show"
    );

}



/* =========================================
   RPS
========================================= */

function playRPS(
  human
){

  if(
    rpsLocked
  )
    return;


  rpsLocked =
    true;


  const choices = [

    "rock",
    "paper",
    "scissors"

  ];


  /*
    کاملاً رندوم
  */

  const bot =

    choices[
      Math.floor(
        Math.random()
        *
        choices.length
      )
    ];


  const icons = {

    rock:"✊",

    paper:"✋",

    scissors:"✌️"

  };


  const box =
    document.getElementById(
      "rpsResult"
    );


  box.innerHTML =
    "🤖 ربات در حال انتخاب...";


  setTimeout(
    ()=>{

      const result =
        rpsWinner(
          human,
          bot
        );


      box.innerHTML = `

        <div
          style="
            font-size:30px;
            direction:ltr
          "
        >

          ${icons[human]}

          &nbsp; VS &nbsp;

          ${icons[bot]}

        </div>

      `;


      /* DRAW */

      if(
        result==="draw"
      ){

        box.innerHTML +=
          "<b>🤝 مساوی شد؛ دوباره انتخاب کن</b>";


        rpsLocked =
          false;


        return;

      }


      /* HUMAN START */

      if(
        result==="human"
      ){

        box.innerHTML +=
          "<b>🔥 تو شروع می‌کنی</b>";


        setTimeout(
          ()=>{

            closeRPS();


            gameActive =
              true;


            setStatus(
              "نوبت تو ❌"
            );

          },

          650
        );


        return;

      }


      /* AI START */

      box.innerHTML +=
        "<b>🤖 AI شروع می‌کنه</b>";


      setTimeout(
        async ()=>{

          closeRPS();


          gameActive =
            true;


          aiThinking =
            true;


          showAIThinking();


          await sleep(
            350
          );


          const move =
            chooseBestMove();


          if(
            move!==null
          ){

            board[move] =
              AI;

          }


          renderBoard();


          aiThinking =
            false;


          setStatus(
            "نوبت تو ❌"
          );

        },

        650
      );

    },

    450
  );

}



function rpsWinner(
  human,
  bot
){

  if(
    human===bot
  )
    return "draw";


  if(

    human==="rock"
    &&
    bot==="scissors"

  )
    return "human";


  if(

    human==="paper"
    &&
    bot==="rock"

  )
    return "human";


  if(

    human==="scissors"
    &&
    bot==="paper"

  )
    return "human";


  return "ai";

}



function closeRPS(){

  document
    .getElementById(
      "rpsOverlay"
    )
    .classList.remove(
      "show"
    );

}



/* =========================================
   HUMAN MOVE
========================================= */

async function humanMove(
  index
){

  if(
    !gameActive
    ||
    aiThinking
    ||
    board[index]!==""
  ){

    return;

  }


  /*
    قبل از حرکت کاربر،
    وضعیت صفحه را ذخیره می‌کنیم
  */

  const before =
    [...board];


  /*
    یادگیری حرکت کاربر
  */

  rememberHumanMove(
    before,
    index
  );


  board[index] =
    HUMAN;


  renderBoard();


  let result =
    checkResult(
      board
    );


  if(result){

    finishGame(
      result
    );

    return;

  }


  aiThinking =
    true;


  showAIThinking();


  await sleep(

    300
    +
    Math.random()*250

  );


  const aiMove =
    chooseBestMove();


  if(
    aiMove!==null
  ){

    board[aiMove] =
      AI;

  }


  renderBoard();


  result =
    checkResult(
      board
    );


  if(result){

    finishGame(
      result
    );

    return;

  }


  aiThinking =
    false;


  setStatus(
    "نوبت تو ❌"
  );

}



/* =========================================
   RESULT CHECK
========================================= */

function checkResult(
  state
){

  for(
    const [a,b,c]
    of WIN_LINES
  ){

    if(

      state[a]!==""

      &&

      state[a]===state[b]

      &&

      state[a]===state[c]

    ){

      return state[a];

    }

  }


  if(
    state.every(
      cell =>
        cell!==""
    )
  ){

    return "DRAW";

  }


  return null;

}



/* =========================================
   MINIMAX
========================================= */

function minimax(

  state,

  depth,

  maximizing,

  alpha,

  beta

){

  const result =
    checkResult(
      state
    );


  /*
    AI برد
  */

  if(
    result===AI
  ){

    return 100-depth;

  }


  /*
    انسان برد
  */

  if(
    result===HUMAN
  ){

    return depth-100;

  }


  /*
    مساوی
  */

  if(
    result==="DRAW"
  ){

    return 0;

  }


  /*
    نوبت AI
  */

  if(maximizing){

    let best =
      -Infinity;


    for(
      let i=0;
      i<9;
      i++
    ){

      if(
        state[i]===""
      ){

        state[i] =
          AI;


        const score =
          minimax(

            state,

            depth+1,

            false,

            alpha,

            beta

          );


        state[i] =
          "";


        best =
          Math.max(
            best,
            score
          );


        alpha =
          Math.max(
            alpha,
            score
          );


        /*
          Alpha-Beta pruning
        */

        if(
          beta<=alpha
        ){

          break;

        }

      }

    }


    return best;

  }


  /*
    نوبت فرضی انسان
  */

  let best =
    Infinity;


  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      state[i]===""
    ){

      state[i] =
        HUMAN;


      const score =
        minimax(

          state,

          depth+1,

          true,

          alpha,

          beta

        );


      state[i] =
        "";


      best =
        Math.min(
          best,
          score
        );


      beta =
        Math.min(
          beta,
          score
        );


      if(
        beta<=alpha
      ){

        break;

      }

    }

  }


  return best;

}



/* =========================================
   ALL AVAILABLE MOVES
========================================= */

function emptyMoves(
  state
){

  const moves =
    [];


  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      state[i]===""
    ){

      moves.push(i);

    }

  }


  return moves;

}



/* =========================================
   ADAPTIVE SCORE
========================================= */

/*

اینجا بخش جدید هوش مصنوعی است.

Minimax اول مشخص می‌کند چه حرکت‌هایی
شکست‌ناپذیر هستند.

اگر چند حرکت به یک اندازه قوی باشند،
این تابع بررسی می‌کند:

"این کاربر در گذشته از این وضعیت
معمولاً کجا حرکت کرده؟"

بعد حرکت AI را طوری انتخاب می‌کند
که در برابر عادت همین کاربر بهتر باشد.

*/

function adaptiveScore(
  aiMove
){

  /*
    AI حرکت احتمالی را انجام می‌دهد
  */

  board[aiMove] =
    AI;


  /*
    حالا این وضعیت،
    وضعیتی است که انسان باید تصمیم بگیرد.
  */

  const key =
    boardKey(
      board
    );


  const history =
    aiMemory.states[key]
    ||
    {};


  const humanMoves =
    emptyMoves(
      board
    );


  if(
    !humanMoves.length
  ){

    board[aiMove] =
      "";

    return 0;

  }


  let historyTotal =
    0;


  humanMoves.forEach(
    move=>{

      historyTotal +=
        history[move]
        ||
        0;

    }
  );


  /*
    اگر AI هنوز این وضعیت
    را از کاربر ندیده باشد،
    کمی ترجیح استراتژیک استفاده می‌شود.
  */

  if(
    historyTotal===0
  ){

    board[aiMove] =
      "";


    let score =
      Math.random()*.05;


    /*
      وسط کمی ارزشمند
    */

    if(
      aiMove===4
    ){

      score+=.25;

    }


    /*
      گوشه‌ها
    */

    if(
      [0,2,6,8]
      .includes(
        aiMove
      )
    ){

      score+=.15;

    }


    return score;

  }


  /*
    احتمال هر حرکت انسان
    از روی سابقه خودش
  */

  let expectedScore =
    0;


  const smoothing =
    .5;


  const denominator =

    historyTotal

    +

    smoothing
    *
    humanMoves.length;


  for(
    const humanMove
    of humanMoves
  ){

    const count =
      history[humanMove]
      ||
      0;


    const probability =

      (
        count
        +
        smoothing
      )

      /

      denominator;


    /*
      فرض می‌کنیم انسان
      این حرکت را بزند
    */

    board[humanMove] =
      HUMAN;


    const result =
      checkResult(
        board
      );


    let futureScore;


    if(
      result===HUMAN
    ){

      futureScore =
        -100;

    }


    else if(
      result==="DRAW"
    ){

      futureScore =
        0;

    }


    else{

      /*
        دوباره نوبت AI می‌شود.

        ببین از اینجا AI
        چقدر شرایط خوبی دارد.
      */

      futureScore =
        minimax(

          board,

          1,

          true,

          -Infinity,

          Infinity

        );

    }


    board[humanMove] =
      "";


    expectedScore +=

      probability
      *
      futureScore;

  }


  board[aiMove] =
    "";


  return expectedScore;

}



/* =========================================
   CHOOSE BEST MOVE
========================================= */

function chooseBestMove(){

  let bestMinimax =
    -Infinity;


  let perfectMoves =
    [];


  /*
    مرحله اول:

    Minimax تمام خانه‌ها را بررسی می‌کند.
  */

  for(
    let i=0;
    i<9;
    i++
  ){

    if(
      board[i]!==""
    )
      continue;


    board[i] =
      AI;


    const score =
      minimax(

        board,

        0,

        false,

        -Infinity,

        Infinity

      );


    board[i] =
      "";


    if(
      score>bestMinimax
    ){

      bestMinimax =
        score;


      perfectMoves =
        [i];

    }


    else if(
      score===bestMinimax
    ){

      perfectMoves.push(
        i
      );

    }

  }


  if(
    perfectMoves.length===0
  ){

    return null;

  }


  /*
    اگر فقط یک حرکت بهترین باشد،
    نیازی به حافظه نیست.
  */

  if(
    perfectMoves.length===1
  ){

    return perfectMoves[0];

  }


  /*
    مرحله دوم:

    چند حرکت Minimax
    همگی به یک اندازه امن‌اند.

    حالا حافظه کاربر
    تصمیم نهایی را می‌گیرد.
  */

  let bestAdaptive =
    -Infinity;


  let adaptiveMoves =
    [];


  for(
    const move
    of perfectMoves
  ){

    const score =
      adaptiveScore(
        move
      );


    if(
      score>bestAdaptive
    ){

      bestAdaptive =
        score;


      adaptiveMoves =
        [move];

    }


    else if(

      Math.abs(
        score-bestAdaptive
      )

      <

      0.0001

    ){

      adaptiveMoves.push(
        move
      );

    }

  }


  /*
    اگر هنوز چند حرکت
    کاملاً مساوی باشند،
    یکی رندوم انتخاب می‌شود.
  */

  return adaptiveMoves[

    Math.floor(

      Math.random()
      *
      adaptiveMoves.length

    )

  ];

}



/* =========================================
   FINISH GAME
========================================= */

function finishGame(
  result
){

  gameActive =
    false;


  aiThinking =
    false;


  /*
    فقط یک بار
    این بازی به حافظه اضافه شود.
  */

  if(
    !gameRecorded
  ){

    aiMemory.games++;


    gameRecorded =
      true;


    saveMemory();

  }


  if(
    result===HUMAN
  ){

    scores.human++;


    setStatus(
      "🏆 تو بردی!"
    );


    highlightWinner(
      HUMAN
    );

  }


  else if(
    result===AI
  ){

    scores.ai++;


    setStatus(
      "🤖 AI برد!"
    );


    highlightWinner(
      AI
    );

  }


  else{

    scores.draw++;


    setStatus(
      "🤝 بازی مساوی شد"
    );

  }


  updateScores();

}



/* =========================================
   WIN HIGHLIGHT
========================================= */

function highlightWinner(
  player
){

  for(
    const line
    of WIN_LINES
  ){

    const [a,b,c] =
      line;


    if(

      board[a]===player

      &&

      board[b]===player

      &&

      board[c]===player

    ){

      line.forEach(
        index=>{

          const cell =
            document.querySelector(

              `.cell[data-index="${index}"]`

            );


          cell.classList.add(

            player===HUMAN

            ? "win-x"

            : "win-o"

          );

        }
      );


      return;

    }

  }

}



/* =========================================
   RENDER
========================================= */

function renderBoard(){

  const cells =
    document.querySelectorAll(
      ".cell"
    );


  cells.forEach(
    (
      cell,
      index
    )=>{

      cell.innerHTML =
        "";


      if(
        board[index]===HUMAN
      ){

        cell.innerHTML = `

          <div class="mark x">

            ×

          </div>

        `;

      }


      else if(
        board[index]===AI
      ){

        cell.innerHTML = `

          <div class="mark o">

            ○

          </div>

        `;

      }

    }
  );

}



/* =========================================
   STATUS
========================================= */

function setStatus(
  text
){

  document.getElementById(
    "status"
  ).textContent =
    text;

}



function showAIThinking(){

  document.getElementById(
    "status"
  ).innerHTML = `

    🤖 AI در حال تحلیل بازی

    <span class="thinking-dots">

      <i></i>
      <i></i>
      <i></i>

    </span>

  `;

}



/* =========================================
   SCORE
========================================= */

function updateScores(){

  document.getElementById(
    "humanScore"
  ).textContent =
    scores.human;


  document.getElementById(
    "aiScore"
  ).textContent =
    scores.ai;


  document.getElementById(
    "drawScore"
  ).textContent =
    scores.draw;

}



/* =========================================
   AI INFO
========================================= */

function updateAIInfo(){

  document.getElementById(
    "learnedGames"
  ).textContent =
    aiMemory.games;

}



/* =========================================
   SLEEP
========================================= */

function sleep(
  ms
){

  return new Promise(

    resolve=>
      setTimeout(
        resolve,
        ms
      )

  );

}



/* =========================================
   START
========================================= */

createBoard();

updateScores();

updateAIInfo();


setTimeout(

  newRound,

  250

);
