<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">

<title>MyCode AI | برنامه‌نویس شخصی</title>

<style>

:root {
    color-scheme: dark;
    --bg: #0b1020;
    --panel: #121a2c;
    --input: #1a263e;
    --border: #2b3a55;
    --text: #edf3ff;
    --muted: #9aabc6;
    --accent: #7357f8;
    --green: #3bd5a0;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    height: 100%;
}

body {
    font-family: Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button, textarea, select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo {
    background: linear-gradient(130deg,#7552fc,#358cff);
    padding: 12px;
    border-radius: 12px;
    font-size: 19px;
    font-weight: bold;
    direction: ltr;
}

h1 {
    margin: 0 0 6px;
    font-size: 18px;
}

small, #connection {
    color: var(--muted);
    font-size: 11px;
}

#connection {
    max-width: 145px;
    text-align: left;
    line-height: 1.8;
}

#connection.ready {
    color: var(--green);
}

/* MODEL BAR */

.topbar {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    padding: 10px;
    background: #10182a;
    border-bottom: 1px solid var(--border);
}

select, .btn {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--input);
    color: var(--text);
    padding: 11px;
    font-size: 12px;
}

select {
    flex: 1;
    min-width: 180px;
    outline: 0;
}

.btn.primary, #send {
    background: var(--accent);
    border-color: var(--accent);
}

/* PROGRESS */

.progress {
    height: 3px;
    background: #253148;
}

#progressBar {
    height: 100%;
    width: 0;
    background: linear-gradient(
        90deg,
        #7357f8,
        #3bd5a0
    );
    transition: width .2s;
}

/* TABS */

.tabs {
    display: none;
}

/* WORKSPACE */

.workspace {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns:
        minmax(0,42%)
        minmax(0,58%);
}

.chat, .code {
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
}

.chat {
    border-left: 1px solid var(--border);
}

.panehead {
    background: var(--panel);
    min-height: 51px;
    padding: 10px 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid var(--border);
}

.panehead strong {
    font-size: 13px;
}

/* CHAT MESSAGES */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 17px;
    scroll-behavior: smooth;
}

.welcome {
    max-width: 470px;
    margin: 40px auto;
    text-align: center;
}

.welcome[hidden] {
    display: none;
}

.hero {
    width: 65px;
    height: 65px;
    margin: 0 auto 18px;
    border-radius: 19px;
    display: grid;
    place-items: center;
    background: linear-gradient(
        130deg,
        #7957fa,
        #2380e8
    );
    font-size: 29px;
    direction: ltr;
}

.welcome h2 {
    font-size: 21px;
    margin: 10px 0;
}

.welcome p {
    color: var(--muted);
    line-height: 2;
    font-size: 12px;
}

.suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 23px;
}

.suggestions button {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    padding: 12px 7px;
    font-size: 12px;
}

/* MESSAGE BUBBLES */

.message {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-bottom: 20px;
}

.message.user {
    align-items: flex-end;
}

.who {
    font-size: 11px;
    color: #b7a7ff;
    margin: 0 7px 7px;
}

.message.user .who {
    color: var(--green);
}

.bubble {
    max-width: 96%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px 14px 14px 4px;
    padding: 12px 14px;
    line-height: 1.9;
    font-size: 13px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    unicode-bidi: plaintext;
    text-align: start;
}

.message.user .bubble {
    background: #26345b;
    border-radius: 14px 14px 4px 14px;
}

/* INPUT */

.composer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 11px;
}

#prompt {
    width: 100%;
    min-height: 68px;
    max-height: 160px;
    resize: vertical;
    outline: 0;
    background: var(--input);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    line-height: 1.8;
    font-size: 13px;
}

#prompt:focus,
#codeEditor:focus {
    border-color: var(--accent);
}

.actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
}

#status {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.buttons {
    display: flex;
    gap: 7px;
    flex-shrink: 0;
}

#send {
    color: #fff;
    border: 0;
    border-radius: 9px;
    padding: 12px 16px;
    font-size: 12px;
}

#stop {
    background: #85374a;
    color: #fff;
    border: 0;
    border-radius: 9px;
    padding: 11px;
    font-size: 12px;
}

#stop[hidden] {
    display: none;
}

/* CODE EDITOR */

.code {
    background: #0a1020;
}

.tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    background: var(--panel);
    padding: 10px;
    border-bottom: 1px solid var(--border);
}

#filename {
    color: var(--muted);
    font: 12px Consolas, monospace;
    margin-left: auto;
    direction: ltr;
}

#codeEditor {
    flex: 1;
    min-height: 100px;
    width: 100%;
    background: #0a1020;
    color: #dce7ff;
    resize: none;
    border: 0;
    outline: 0;
    padding: 14px;
    font: 13px/1.8 Consolas, monospace;
    direction: ltr;
    text-align: left;
    tab-size: 4;
}

.previewTitle {
    background: var(--panel);
    font-size: 12px;
    padding: 10px;
    border-top: 1px solid var(--border);
}

#preview {
    height: 33%;
    min-height: 110px;
    border: 0;
    background: #fff;
    width: 100%;
}

/* MOBILE */

@media(max-width:800px) {

    header {
        padding: 10px;
    }

    .logo {
        font-size: 17px;
    }

    h1 {
        font-size: 16px;
    }

    .workspace {
        display: flex;
        flex-direction: column;
    }

    .tabs {
        display: flex;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
    }

    .tabs button {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 13px;
    }

    .tabs button.active {
        color: #fff;
        border-bottom: 2px solid var(--accent);
    }

    .chat, .code {
        flex: 1;
    }

    .code {
        display: none;
    }

    .workspace.show-code .chat {
        display: none;
    }

    .workspace.show-code .code {
        display: flex;
    }

    .messages {
        padding: 12px;
    }

    .welcome {
        margin: 28px auto;
    }
}

</style>
</head>

<!-- =====================================
     AI WEB WORKER
===================================== -->

<script id="aiWorkerCode" type="text/plain">

let generator = null;

let chosen = '';

let loaded = false;

const models = {

    light:
        'onnx-community/SmolLM2-135M-Instruct-ONNX',

    coder:
        'onnx-community/Qwen2.5-Coder-0.5B-Instruct'

};

let lib = null;


/* WORKER MESSAGE HANDLER */

self.onmessage = async (event) => {

    const {
        type,
        model,
        messages,
        maxTokens
    } = event.data;

    try {

        /* LOAD MODEL */

        if (type === 'load') {

            loaded = false;

            chosen = model;

            generator = null;

            self.postMessage({

                type: 'info',

                text: 'در حال بارگیری کتابخانه پردازش...'

            });


            lib = lib || await import(
                'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1'
            );


            lib.env.allowLocalModels = false;

            lib.env.backends.onnx.wasm.numThreads = 1;


            generator = await lib.pipeline(

                'text-generation',

                models[model],

                {

                    device: 'wasm',

                    dtype: 'q4',

                    progress_callback: (p) => {

                        if (
                            p.status === 'progress' &&
                            Number.isFinite(p.progress)
                        ) {

                            self.postMessage({

                                type: 'progress',

                                percentage:
                                    Math.round(p.progress),

                                file: p.file || ''

                            });

                        }

                        else if (
                            p.status === 'initiate'
                        ) {

                            self.postMessage({

                                type: 'info',

                                text:
                                    'در حال دریافت ' +
                                    (p.file || 'مدل')

                            });

                        }

                    }

                }

            );


            loaded = true;


            self.postMessage({

                type: 'ready',

                model

            });

        }


        /* GENERATE RESPONSE */

        if (type === 'generate') {

            if (!loaded || !generator) {

                throw new Error(
                    'ابتدا مدل را فعال کن.'
                );

            }


            self.postMessage({

                type: 'started'

            });


            let streamed = '';


            const streamer = new lib.TextStreamer(

                generator.tokenizer,

                {

                    skip_prompt: true,

                    skip_special_tokens: true,

                    callback_function: piece => {

                        streamed += piece;

                        self.postMessage({

                            type: 'delta',

                            text: piece

                        });

                    }

                }

            );


            const result = await generator(

                messages,

                {

                    max_new_tokens: maxTokens,

                    do_sample: false,

                    streamer

                }

            );


            /* EXTRACT RESPONSE */

            const raw =
                result?.[0]?.generated_text;


            let answer = Array.isArray(raw)

                ? (raw.at(-1)?.content || '')

                : (
                    typeof raw === 'string'
                    ? raw
                    : ''
                );


            if (!answer.trim()) {

                answer = streamed;

            }


            if (!answer.trim()) {

                throw new Error(
                    'مدل پاسخ متنی تولید نکرد.'
                );

            }


            self.postMessage({

                type: 'done',

                text: answer

            });

        }

    }

    catch (err) {

        self.postMessage({

            type: 'failed',

            phase: type,

            error:
                err?.message ||
                String(err)

        });

    }

};

</script>


<!-- =====================================
     MAIN APPLICATION

<script>

/* ELEMENTS */

const $ = id => document.getElementById(id);


const ui = {

    model: $('model'),

    load: $('load'),

    send: $('send'),

    stop: $('stop'),

    input: $('prompt'),

    status: $('status'),

    connection: $('connection'),

    progress: $('progressBar'),

    messages: $('messages'),

    welcome: $('welcome'),

    editor: $('codeEditor'),

    preview: $('preview'),

    filename: $('filename')

};


/* CONFIG */

const modelNames = {

    light: 'SmolLM2 135M',

    coder: 'Qwen2.5 Coder 0.5B'

};


const storageKey = 'mycode_chat_worker_v3';


/* STATE */

let worker = null;

let workerURL = null;

let ready = false;

let loading = false;

let busy = false;

let selectedModel = '';

let history = [];

let currentAnswer = null;

let generationStart = 0;

let timer = null;

let language = 'html';


/* STATUS */

function status(text) {

    ui.status.textContent = text;

}


/* BUTTON STATES */

function buttons() {

    ui.load.disabled =
        loading || busy;

    ui.model.disabled =
        loading || busy;

    ui.send.disabled =
        loading ||
        busy ||
        !ui.input.value.trim();

    ui.stop.hidden = !busy;

}


/* SCROLL */

function scrollDown() {

    ui.messages.scrollTop =
        ui.messages.scrollHeight;

}


/* ADD MESSAGE */

function message(role, text) {

    const row =
        document.createElement('div');

    row.className =
        'message ' + role;


    const who =
        document.createElement('div');

    who.className = 'who';

    who.textContent =
        role === 'user'
        ? 'شما'
        : 'MyCode AI';


    const bubble =
        document.createElement('div');

    bubble.className = 'bubble';

    bubble.textContent = text;


    row.append(who, bubble);

    ui.messages.append(row);

    scrollDown();

    return bubble;

}


/* SAVE CHAT */

function persist() {

    try {

        localStorage.setItem(

            storageKey,

            JSON.stringify({

                history:
                    history.slice(-10),

                code:
                    ui.editor.value.slice(0, 100000),

                language

            })

        );

    }

    catch (e) {}

}


/* RESTORE CHAT */

function restore() {

    try {

        const saved = JSON.parse(

            localStorage.getItem(storageKey) || '{}'

        );


        if (Array.isArray(saved.history)) {

            history = saved.history.filter(

                x =>
                    x &&
                    ['user','assistant'].includes(x.role) &&
                    typeof x.content === 'string'

            ).slice(-10);


            if (history.length) {

                ui.welcome.hidden = true;

            }


            history.forEach(x => {

                message(

                    x.role === 'user'
                    ? 'user'
                    : 'ai',

                    x.content

                );

            });

        }


        if (typeof saved.code === 'string') {

            ui.editor.value = saved.code;

        }


        language =
            saved.language || 'html';


        fileName();

    }

    catch (e) {}

}


/* FILE NAME */

function fileName() {

    const ext = {

        javascript: 'js',

        js: 'js',

        python: 'py',

        py: 'py',

        html: 'html',

        css: 'css',

        cpp: 'cpp',

        'c++': 'cpp',

        json: 'json',

        php: 'php',

        sql: 'sql'

    };


    ui.filename.textContent =

        'mycode-project.' +

        (ext[language] || 'txt');

}


/* EXTRACT CODE */

function extractCode(text) {

    const blocks = [

        ...text.matchAll(

            /```([^\r\n`]*)\r?\n([\s\S]*?)```/g

        )

    ];


    if (blocks.length) {

        const pick =

            blocks.find(

                x =>
                    x[1].trim().toLowerCase()
                    === 'html'

            ) || blocks[0];


        language =

            pick[1]
                .trim()
                .split(/\s+/)[0]
                .toLowerCase() || 'txt';


        ui.editor.value =
            pick[2].trim();


        fileName();

        persist();

        return;

    }


    if (

        /^\s*<(?:!doctype\s+html|html)(?:\s|>)/i
        .test(text)

    ) {

        language = 'html';

        ui.editor.value =
            text.trim();

        fileName();

        persist();

    }

}


/* RESET WORKER */

function resetWorker() {

    if (worker) {

        worker.terminate();

        worker = null;

    }


    if (workerURL) {

        URL.revokeObjectURL(workerURL);

        workerURL = null;

    }


    ready = false;

    loading = false;

    busy = false;

    selectedModel = '';


    clearInterval(timer);

    timer = null;


    ui.connection.textContent =
        'مدل بارگذاری نشده';


    ui.connection.classList.remove(
        'ready'
    );


    ui.load.textContent =
        'فعال‌سازی هوش مصنوعی';


    buttons();

}


/* LOAD MODEL */

function loadModel() {

    if (loading || busy) {
        return;
    }


    resetWorker();

    loading = true;

    ui.progress.style.width = '0%';


    ui.connection.textContent =
        'در حال بارگذاری...';


    status(

        'در حال آماده‌سازی مدل؛ ' +
        'ممکن است چند دقیقه طول بکشد.'

    );


    buttons();


    try {

        workerURL = URL.createObjectURL(

            new Blob(

                [
                    $('aiWorkerCode').textContent
                ],

                {
                    type: 'text/javascript'
                }

            )

        );


        const w = new Worker(

            workerURL,

            {
                type: 'module'
            }

        );


        worker = w;


        w.onmessage = e => {

            if (worker !== w) {
                return;
            }

            onWorkerMessage(e.data);

        };


        w.onerror = e => {

            if (worker !== w) {
                return;
            }


            const msg =

                e.message ||

                'اجرای Worker در این مرورگر ناموفق بود.';


            resetWorker();


            status(

                'خطای موتور هوش مصنوعی: ' +
                msg

            );

        };


        w.postMessage({

            type: 'load',

            model: ui.model.value

        });

    }

    catch (e) {

        resetWorker();

        status(

            'امکان ساخت Worker نیست: ' +
            e.message

        );

    }

}


/* FINISH GENERATION */

function finishBusy() {

    busy = false;


    clearInterval(timer);

    timer = null;


    currentAnswer = null;

    buttons();

}


/* HANDLE WORKER MESSAGES */

function onWorkerMessage(data) {

    /* INFO */

    if (data.type === 'info') {

        status(data.text);

        return;

    }


    /* PROGRESS */

    if (data.type === 'progress') {

        ui.progress.style.width =

            Math.max(

                0,

                Math.min(
                    100,
                    data.percentage
                )

            ) + '%';


        status(

            'دانلود مدل: ' +

            data.percentage +

            '٪  ' +

            (data.file || '')

        );

        return;

    }


    /* READY */

    if (data.type === 'ready') {

        loading = false;

        ready = true;

        selectedModel = data.model;


        ui.progress.style.width =
            '100%';


        ui.connection.textContent =
            '● هوش مصنوعی فعال است';


        ui.connection.classList.add(
            'ready'
        );


        ui.load.textContent =
            'مدل فعال شد';


        status(

            'آماده است. ' +
            'یک پیام کوتاه مثل «سلام» بفرست.'

        );


        buttons();

        return;

    }


    /* GENERATION STARTED */

    if (data.type === 'started') {

        status(

            'در حال تولید پاسخ روی CPU گوشی...'

        );

        return;

    }


    /* STREAMING RESPONSE */

    if (

        data.type === 'delta' &&

        currentAnswer

    ) {

        currentAnswer.bubble.textContent +=
            data.text;


        scrollDown();

        return;

    }


    /* RESPONSE COMPLETE */

    if (data.type === 'done') {

        if (!currentAnswer) {
            return;
        }


        currentAnswer.bubble.textContent =
            data.text;


        history.push({

            role: 'assistant',

            content: data.text

        });


        extractCode(data.text);

        persist();


        finishBusy();


        status(

            'پاسخ دریافت شد. ' +

            'برای دیدن کد، تب «ویرایشگر کد» را باز کن.'

        );


        scrollDown();

        return;

    }


    /* ERRORS */

    if (data.type === 'failed') {

        if (data.phase === 'load') {

            resetWorker();


            status(

                'مدل بارگذاری نشد: ' +

                data.error

            );

        }

        else {

            if (currentAnswer) {

                currentAnswer.bubble.textContent =

                    'خطا در تولید پاسخ: ' +

                    data.error;

            }


            if (

                history.at(-1)?.role === 'user'

            ) {

                history.pop();

            }


            finishBusy();

            persist();


            status(

                'تولید پاسخ خطا داشت. ' +

                'مدل سبک‌تر را امتحان کن.'

            );

        }

        return;

    }

}


/* SEND CHAT MESSAGE */

function send() {

    const text =
        ui.input.value.trim();


    if (

        !text ||

        busy ||

        loading

    ) {

        return;

    }


    if (

        !ready ||

        !worker ||

        selectedModel !== ui.model.value

    ) {

        status(

            'ابتدا دکمه فعال‌سازی ' +
            'هوش مصنوعی را بزن.'

        );

        return;

    }


    /* DISPLAY USER MESSAGE */

    ui.welcome.hidden = true;


    message(
        'user',
        text
    );


    history.push({

        role: 'user',

        content: text

    });


    ui.input.value = '';

    busy = true;

    buttons();


    /* AI RESPONSE PLACEHOLDER */

    const bubble = message(

        'ai',

        'در حال فکر کردن...'

    );


    currentAnswer = {
        bubble
    };


    bubble.textContent = '';


    /* SYSTEM PROMPT */

    const prompt = [

        'You are MyCode AI, a concise coding assistant.',

        'Answer in the user language.',

        'For coding requests, provide real code in fenced markdown blocks.',

        'Keep output short and correct.',

        'Do not claim you tested it.'

    ].join(' ');


    /* CHAT HISTORY */

    const messages = [

        {

            role: 'system',

            content: prompt

        },

        ...history.slice(-4).map(

            x => ({

                role: x.role,

                content:
                    x.content.slice(0,900)

            })

        )

    ];


    /* START TIMER */

    generationStart = Date.now();


    status(
        'در حال تولید پاسخ...'
    );


    timer = setInterval(() => {

        if (busy) {

            const elapsed = Math.round(

                (Date.now() - generationStart) / 1000

            );


            status(

                'در حال تولید پاسخ... ' +

                elapsed +

                ' ثانیه — با «توقف» می‌توانی لغو کنی.'

            );

        }

    }, 1000);


    persist();


    /* SEND TO AI WORKER */

    worker.postMessage({

        type: 'generate',

        messages,

        maxTokens:

            ui.model.value === 'light'

            ? 80

            : 220

    });

}


/* STOP GENERATION */

function stop() {

    if (!busy) {
        return;
    }


    if (currentAnswer) {

        currentAnswer.bubble.textContent +=

            '\n[تولید پاسخ متوقف شد]';

    }


    if (

        history.at(-1)?.role === 'user'

    ) {

        history.pop();

    }


    resetWorker();

    persist();


    status(

        'پردازش متوقف شد. ' +

        'برای ادامه باید مدل را دوباره فعال کنی.'

    );

}


/* NEW CHAT */

function newChat() {

    if (busy) {

        status(

            'ابتدا دکمه توقف را بزن.'

        );

        return;

    }


    history = [];

    ui.messages.innerHTML = '';


    message(

        'ai',

        'گفتگوی جدید آماده است. درخواستت را بنویس.'

    );


    ui.editor.value = '';

    ui.preview.srcdoc = '';

    language = 'html';


    fileName();

    persist();


    status(

        ready

        ? 'گفتگوی جدید آماده است.'

        : 'برای گفتگو ابتدا مدل را فعال کن.'

    );

}


/* MOBILE TABS */

function showTab(name) {

    $('workspace').classList.toggle(

        'show-code',

        name === 'code'

    );


    $('chatTab').classList.toggle(

        'active',

        name === 'chat'

    );


    $('codeTab').classList.toggle(

        'active',

        name === 'code'

    );

}


/* RUN HTML */

function runCode() {

    if (!ui.editor.value.trim()) {

        status(
            'ابتدا کد وارد کن.'
        );

        return;

    }


    if (

        !['html','htm'].includes(language)

    ) {

        status(

            'پیش‌نمایش فقط برای HTML است.'

        );

        return;

    }


    ui.preview.srcdoc =
        ui.editor.value;


    status(
        'پیش‌نمایش HTML اجرا شد.'
    );

}


/* DOWNLOAD CODE */

function download() {

    if (!ui.editor.value.trim()) {

        status(
            'کدی برای دانلود نیست.'
        );

        return;

    }


    const blob = new Blob(

        [ui.editor.value],

        {
            type: 'text/plain;charset=utf-8'
        }

    );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement('a');


    a.href = url;

    a.download =
        ui.filename.textContent;


    document.body.append(a);

    a.click();

    a.remove();


    setTimeout(() => {

        URL.revokeObjectURL(url);

    }, 1000);

}


/* COPY CODE */

async function copy() {

    try {

        await navigator.clipboard.writeText(

            ui.editor.value

        );


        status(
            'کد کپی شد.'
        );

    }

    catch (e) {

        status(
            'کپی ناموفق بود.'
        );

    }

}


/* BUTTON EVENTS */

ui.load.addEventListener(

    'click',

    loadModel

);


ui.send.addEventListener(

    'click',

    send

);


ui.stop.addEventListener(

    'click',

    stop

);


/* INPUT EVENTS */

ui.input.addEventListener(

    'input',

    buttons

);


ui.input.addEventListener(

    'keydown',

    e => {

        if (

            e.key === 'Enter' &&

            e.ctrlKey

        ) {

            e.preventDefault();

            send();

        }

    }

);


/* MODEL CHANGED */

ui.model.addEventListener(

    'change',

    () => {

        if (worker) {

            resetWorker();


            status(

                'مدل تغییر کرد. ' +

                'دوباره «فعال‌سازی» را بزن.'

            );

        }

    }

);


/* NEW CHAT EVENT */

$('newChat').addEventListener(

    'click',

    newChat

);


/* TAB EVENTS */

$('chatTab').addEventListener(

    'click',

    () => showTab('chat')

);


$('codeTab').addEventListener(

    'click',

    () => showTab('code')

);


/* CODE TOOLS */

$('run').addEventListener(

    'click',

    runCode

);


$('download').addEventListener(

    'click',

    download

);


$('copy').addEventListener(

    'click',

    copy

);


/* SAVE EDITOR */

ui.editor.addEventListener(

    'input',

    persist

);


/* SUGGESTION BUTTONS */

document.querySelectorAll(

    '[data-ask]'

).forEach(b => {

    b.addEventListener(

        'click',

        () => {

            ui.input.value =
                b.dataset.ask;


            buttons();

            ui.input.focus();

        }

    );

});


/* INITIALIZE */

restore();

buttons();

</script>

</body>
</html>
